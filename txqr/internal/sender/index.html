<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>序列化工具</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#101014; color:#eee; margin:0; min-height:100vh; }
  #controls { max-width:460px; margin:8vh auto; padding:24px; background:#1b1b22; border-radius:12px; }
  h1 { margin:0 0 4px; font-size:20px; }
  p.sub { margin:0 0 18px; font-size:13px; opacity:.6; }
  label { display:block; margin:14px 0 6px; font-size:13px; opacity:.8; }
  input[type=file] { width:100%; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  input[type=number] { width:100%; padding:8px; border-radius:6px; border:1px solid #3a3a44; background:#232330; color:#eee; }
  select { width:100%; padding:8px; border-radius:6px; border:1px solid #3a3a44; background:#232330; color:#eee; }
  button { margin-top:22px; width:100%; padding:12px; font-size:16px; border:none; border-radius:8px; background:#2f81f7; color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #status { margin-top:14px; font-size:13px; opacity:.7; min-height:18px; }

  #overlay { display:none; position:fixed; inset:0; background:#000; z-index:10; }
  #overlay.active { display:block; }
  #qrwrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
  /* No `image-rendering: pixelated`. Nearest-neighbour looks tidy but is
     destructive here: the page stretches a fixed-size PNG to min(92vw,90vh),
     and when the window is a few percent smaller than the PNG every other
     module row gets dropped, which kills decoding outright. Smooth resampling
     keeps every module distinguishable at any window size (measured: 12/13
     sizes decoded with smooth vs 5/13 with pixelated at the old render size). */
  /* Size comes from JS (applyFrameSize): modules*ppm device pixels, i.e. an
     exact whole number of pixels per module, never a viewport stretch. */
  #qr { display:block; margin:0 auto; }
  /* The QR range frame: prominent so the receiver knows exactly what to box,
     but sits OUTSIDE a quiet-zone padding so it never crowds the codes. A
     receiver that boxes it in still decodes via edge-crop + upscale. */
  /* White card, not black: a QR's quiet zone is white, so a dark surround puts
     an inverted-contrast ring right at the symbol boundary and the detector
     loses the symbol's extent (measured: same image decodes 4/4 on white and
     1/4 on a dark surround at 1:1). The 20px white ring means a region boxed a
     little too wide still only sees white around the code. */
  #grid { display:grid; gap:6px; width:min(88vw, 86vh); height:min(88vw, 86vh); background:#fff; position:relative; margin-top:30px; padding:18px; border:4px solid rgba(0,180,100,.95); outline:2px dashed rgba(0,0,0,.35); outline-offset:10px; box-shadow:0 0 0 20px #fff; }
  #grid::after { content:'二维码区域 ── 接收端框选此处'; position:absolute; left:50%; top:-30px; transform:translateX(-50%); background:rgba(0,220,120,.92); color:#00110a; font-size:13px; font-weight:bold; padding:2px 12px; border-radius:4px; white-space:nowrap; z-index:5; pointer-events:none; }
  #grid img { display:block; } /* sized by applyFrameSize, see #qr */
  #grid { place-items:center; }
  #stats { position:fixed; top:8px; left:0; right:0; text-align:center; font-size:13px; font-family:Consolas,monospace; opacity:.85; z-index:11; pointer-events:none; text-shadow:0 0 4px #000; }
  #hint { margin-top:10px; font-size:12px; opacity:.55; }
  #controls-bar { position:fixed; top:8px; right:12px; z-index:12; display:flex; gap:8px; }
  #controls-bar button { width:auto; margin:0; padding:6px 14px; font-size:13px; }
  #pause { background:#2f81f7; }
  #stop { background:#d9a03c; }
  #cancel { background:#d33; }
</style>
</head>
<body>

<div id="controls">
  <h1>序列化工具</h1>
  <p class="sub">选择文件，将其序列化为可视数据帧并全屏播放。</p>

  <label>文件</label>
  <input type="file" id="file">

  <div class="row">
    <div>
      <label>每帧字节数 split</label>
      <input type="number" id="split" value="2048" min="10" step="10">
    </div>
    <div>
      <label>帧率 FPS</label>
      <input type="number" id="fps" value="30" min="1" step="1">
    </div>
    <div>
      <label>网格 (N×N)</label>
      <input type="number" id="gridSize" value="1" min="1" max="4" step="1">
    </div>
  </div>

  <label style="margin-top:14px; display:inline-flex; align-items:center; gap:8px;"><input type="checkbox" id="colorMode" style="width:auto;"> Color Matrix 模式（2 位/模块，每帧上限 <span id="colorCap">1426</span> B，split 会自动收敛）</label>

  <label style="margin-top:14px; display:inline-flex; align-items:center; gap:8px;"><input type="checkbox" id="decimenMode" style="width:auto;"> Decimen 模式（DCF2 + 喷泉码，V40-L / mask 4 / ECC L）</label>

  <div class="row">
    <div>
      <label>缩放方式</label>
      <select id="fitMode" style="width:100%; padding:8px; border-radius:6px; border:1px solid #3a3a44; background:#232330; color:#eee;">
        <option value="fixed" selected>固定不缩放（推荐）</option>
        <option value="scale">允许缩放（铺满窗口）</option>
        <option value="manual">手动（指定 px/模块）</option>
      </select>
    </div>
    <div id="ppmWrap" style="display:none;">
      <label>像素/模块</label>
      <input type="number" id="ppmInput" value="4" min="2" max="8" step="1">
    </div>
    <div>
      <label>编码方案</label>
      <select id="codec" style="width:100%; padding:8px; border-radius:6px; border:1px solid #3a3a44; background:#232330; color:#eee;">
        <option value="lt">LT (经典)</option>
        <option value="binary">Binary</option>
        <option value="raptor">Raptor (RFC 5053，长度非整倍数时回落 LT)</option>
        <option value="raptorq" selected>RaptorQ (RFC 6330)</option>
        <option value="online">Online</option>
      </select>
    </div>
  </div>

  <button id="start">序列化</button>
  <div id="status"></div>
</div>

<div id="overlay">
  <div id="stats"></div>
  <div id="controls-bar">
    <button id="pause">暂停</button>
    <button id="stop">停止</button>
    <button id="cancel">取消</button>
  </div>
  <div id="qrwrap">
    <div id="grid"></div>
    <div id="hint">暂停/继续：空格 | 停止：S | 取消：C | Esc 返回</div>
  </div>
</div>

<script>
const fileInput = document.getElementById('file');
const splitInput = document.getElementById('split');
const fpsInput = document.getElementById('fps');
const gridInput = document.getElementById('gridSize');
const codecInput = document.getElementById('codec');
const fitModeInput = document.getElementById('fitMode');
const ppmInput = document.getElementById('ppmInput');
const ppmWrap = document.getElementById('ppmWrap');

// The scaling mode decides how much the browser is allowed to resample:
//   fixed  — server renders N device px per module, page shows it 1:1 (default)
//   scale  — page stretches the image to the cell; smoothest size, least robust
//   manual — you pick the module size; still rendered and shown 1:1
const FIT_MODES = ['fixed', 'scale', 'manual'];
function loadFitMode() {
  try {
    const saved = localStorage.getItem('qrt-pro.fitMode');
    if (FIT_MODES.includes(saved)) fitModeInput.value = saved;
    const ppm = parseInt(localStorage.getItem('qrt-pro.ppm'), 10);
    if (ppm >= 2 && ppm <= 8) ppmInput.value = ppm;
  } catch (e) { /* private mode: defaults are fine */ }
}
function saveFitMode() {
  try {
    localStorage.setItem('qrt-pro.fitMode', fitModeInput.value);
    localStorage.setItem('qrt-pro.ppm', String(clampPPM(ppmInput.value)));
  } catch (e) { /* ignore */ }
}
function clampPPM(v) {
  const n = parseInt(v, 10);
  if (!isFinite(n)) return 4;
  return Math.max(2, Math.min(8, n));
}
function syncFitModeUI() {
  ppmWrap.style.display = fitModeInput.value === 'manual' ? '' : 'none';
  saveFitMode();
  applyFrameSize();
}
loadFitMode();
fitModeInput.addEventListener('change', syncFitModeUI);
ppmInput.addEventListener('change', syncFitModeUI);
ppmWrap.style.display = fitModeInput.value === 'manual' ? '' : 'none';
const colorModeInput = document.getElementById('colorMode');
const decimenModeInput = document.getElementById('decimenMode');
const startBtn = document.getElementById('start');
const pauseBtn = document.getElementById('pause');
const stopBtn = document.getElementById('stop');
const cancelBtn = document.getElementById('cancel');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const gridEl = document.getElementById('grid');
const statsEl = document.getElementById('stats');

// Decimen and Color Matrix are mutually exclusive. Decimen pins the reference
// sender's parameters (2953 B/frame V40-L, ECC L, mask 4, 60 fps, 2 codes) —
// the knobs that don't apply (split/codec/fps/grid) are all disabled so the
// mode is never dragged around by classic-mode settings.
const DECIMEN_FPS = 60;
const DECIMEN_CODES = 2; // 1×2, the reference's phone-to-phone grid
function applyDecimenMode() {
  if (decimenModeInput.checked) {
    colorModeInput.checked = false;
    splitInput.disabled = true;
    codecInput.disabled = true;
    fpsInput.disabled = true;
    gridInput.disabled = true;
    colorModeInput.disabled = true;
  } else {
    splitInput.disabled = false;
    codecInput.disabled = false;
    fpsInput.disabled = false;
    gridInput.disabled = false;
    colorModeInput.disabled = false;
  }
}
decimenModeInput.addEventListener('change', applyDecimenMode);
applyDecimenMode();
// Color Matrix frames hold far fewer bytes than a QR symbol, so a split that
// is fine for QR silently renders nothing here. The server clamps it anyway;
// showing the cap up front saves a "why is nothing happening" round trip.
const COLOR_SPLIT_CAP = 1426;
colorModeInput.addEventListener('change', () => {
  if (colorModeInput.checked) {
    decimenModeInput.checked = false;
    if ((parseInt(splitInput.value, 10) || 0) > COLOR_SPLIT_CAP) {
      splitInput.value = COLOR_SPLIT_CAP;
    }
  }
});

let session = null;   // current encoded session, null if none
let playbackRAF = null;
let playbackGeneration = 0;
let playbackCells = [];
const PREFETCH_DEPTH = 3;
const PRESENTATION_TOLERANCE_MS = 0.75;
let playbackEpoch = null;
let presentedFrames = 0;
function releaseFrame(frame) {
  if (frame && frame.url) { URL.revokeObjectURL(frame.url); frame.url = null; }
}
function releaseTiles() {
  for (const tile of tiles) {
    if (tile.qrtURL) URL.revokeObjectURL(tile.qrtURL);
    tile.qrtURL = null;
  }
}
function clearPlayback() {
  playbackGeneration++;
  if (playbackRAF !== null) cancelAnimationFrame(playbackRAF);
  playbackRAF = null;
  for (const cell of playbackCells) for (const slot of cell.slots) {
    if (slot.controller) slot.controller.abort();
    releaseFrame(slot);
    if (slot.image) slot.image.removeAttribute('src');
  }
  playbackCells = [];
}
let running = false;  // overlay active and playing
let paused = false;
let encodeGeneration = 0;
let encoding = false; // a serialization request is in flight
let encodeAbort = null; // AbortController for the in-flight serialization
let fileMD5 = '';     // MD5 of the currently selected file
let startTime = 0;
let tiles = [];
let seqCursor = 0;    // next sequence reserved for prefetch

function bytesFmt(n) {
  if (n >= 1048576) return (n / 1048576).toFixed(2) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}

// gridDims mirrors the reference: count of codes -> {cols, rows}.
function gridDims(n) {
  const cols = Math.floor(Math.sqrt(n));
  const rows = Math.ceil(n / Math.max(1, cols));
  return { cols, rows };
}

// buildTiles creates one tile per code, laid out per gridDims (1 → 1×1,
// 2 → 1×2, 4 → 2×2). Classic mode passes cols*cols, decimen passes its code count.
function buildTiles(codes, dims) {
  releaseTiles();
  gridEl.innerHTML = '';
  gridEl.style.gridTemplateColumns = 'repeat(' + dims.cols + ', 1fr)';
  gridEl.style.gridTemplateRows = 'repeat(' + dims.rows + ', 1fr)';
  tiles = [];
  for (let i = 0; i < codes; i++) {
    const img = document.createElement('img');
    img.alt = 'QR';
    gridEl.appendChild(img);
    tiles.push(img);
  }
}

// fitBudget returns the device-pixel budget for ONE code, estimated from the
// viewport before the overlay is laid out (the grid has no box until it is
// shown). The server turns it into an integer module size, so being off by a
// few pixels only changes how large the code looks, never its correctness.
function fitBudget(codesCount) {
  const dims = gridDims(codesCount);
  const box = Math.min(window.innerWidth * 0.88, window.innerHeight * 0.86) - 44;
  const cell = Math.min(box / dims.cols, box / dims.rows) - 8;
  return Math.max(0, Math.floor(cell * (window.devicePixelRatio || 1)));
}

// applyFrameSize shows every frame at exactly the size the server rendered it:
// modules * ppm device pixels, never a viewport-relative stretch. This is the
// whole point of the ppm plumbing — a barcode detector estimates one module
// width and samples on a fixed grid, so a fractional module size (2.37 px, say)
// leaves some modules 2 px and others 3 px, the grid drifts, and the frame
// decodes or fails depending on the exact ratio. Measured at 1:1: 21 of 21
// frame/size/margin combinations decoded; stretched to the viewport only ~60%
// did, with whole runs of zero.
function applyFrameSize() {
  if (!session || !tiles.length || !session.modules || !session.ppm) return;
  const dpr = window.devicePixelRatio || 1;
  const cell = tileBudget();

  if (fitModeInput.value === 'scale') {
    // The user asked for the image to fill the cell. This is the one mode where
    // the browser resamples on purpose, so it costs reliability — it is here so
    // the old behaviour is still reachable.
    for (const t of tiles) {
      t.style.width = '100%';
      t.style.height = 'auto';
      t.style.maxWidth = '';
      t.style.maxHeight = '';
    }
    session.fitOk = true;
    session.applied = 'scale';
    return;
  }

  const css = (session.modules * session.ppm) / dpr;
  // If the window shrank below what the frames were rendered for, the choice is
  // clipping (undecodable) or scaling (uneven modules). Scale, and say so.
  const fits = cell <= 0 || css <= cell + 0.5;
  for (const t of tiles) {
    t.style.width = css + 'px';
    t.style.height = css + 'px';
    t.style.maxWidth = fits ? '' : Math.floor(cell) + 'px';
    t.style.maxHeight = fits ? '' : Math.floor(cell) + 'px';
  }
  session.fitOk = fits;
  // Manual size is baked into the frames, so a changed number needs a re-encode.
  session.applied = fitModeInput.value === 'manual' && clampPPM(ppmInput.value) !== session.ppm
    ? 'pending'
    : 'exact';
}

// tileBudget returns the CSS pixels actually available for one cell now.
function tileBudget() {
  const box = gridEl.getBoundingClientRect();
  if (!box.width || !box.height) return 0;
  const style = getComputedStyle(gridEl);
  const px = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
  const py = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
  const bx = parseFloat(style.borderLeftWidth) + parseFloat(style.borderRightWidth);
  const by = parseFloat(style.borderTopWidth) + parseFloat(style.borderBottomWidth);
  const gap = parseFloat(style.gap) || 0;
  const cols = session.dims.cols, rows = session.dims.rows;
  const w = (box.width - bx - px - gap * (cols - 1)) / cols;
  const h = (box.height - by - py - gap * (rows - 1)) / rows;
  return Math.min(w, h);
}

let fitTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(applyFrameSize, 120);
});

function showFileInfo() {
  const file = fileInput.files[0];
  if (!file) { statusEl.textContent = ''; return; }
  const ready = session ? '（已编码，可「继续序列化」）' : '';
  const md5 = fileMD5 ? '  MD5: ' + fileMD5 : '';
  statusEl.textContent = file.name + '  ' + bytesFmt(file.size) + ready + md5;
}

// Compute the file's MD5 locally via the server so it can be shown the
// moment a file is picked, long before any serialization starts.
async function updateFileMD5() {
  const file = fileInput.files[0];
  fileMD5 = '';
  showFileInfo();
  if (!file) return;
  try {
    const resp = await fetch('/md5', { method: 'POST', body: await file.arrayBuffer() });
    if (!resp.ok) return;
    const data = await resp.json();
    if (fileInput.files[0] === file) {
      fileMD5 = data.md5 || '';
      showFileInfo();
    }
  } catch (e) { /* network hiccup: leave MD5 empty */ }
}

async function encodeFile(generation) {
  const file = fileInput.files[0];
  if (!file) { statusEl.textContent = '请先选择文件'; return null; }
  if (file.size === 0 || file.size > 64 * 1024 * 1024) { statusEl.textContent = '请选择非空且不超过 64 MiB 的文件'; return null; }
  const decimen = decimenModeInput.checked;
  // Decimen uses fixed reference parameters; only classic mode reads the knobs.
  const fps = decimen ? DECIMEN_FPS : Math.max(1, Math.min(120, parseFloat(fpsInput.value) || 30));
  const cols = decimen ? DECIMEN_CODES : Math.max(1, Math.min(4, parseInt(gridInput.value, 10) || 1));
  const split = parseInt(splitInput.value, 10) || 1024;
  const codec = codecInput.value;
  startBtn.disabled = false;
  startBtn.textContent = '取消序列化';
  encoding = true;
  const controller = new AbortController();
  encodeAbort = controller;
  statusEl.textContent = '编码中...（点击「取消序列化」可中止）';
  try {
    let url;
    if (decimen) {
      url = '/encode?mode=decimen'
        + '&name=' + encodeURIComponent(file.name)
        + '&type=' + encodeURIComponent(file.type || 'application/octet-stream');
    } else {
      url = '/encode?split=' + split + '&codec=' + codec + '&name=' + encodeURIComponent(file.name);
      if (colorModeInput.checked) url += '&mode=color';
    }
    const codesCount = decimen ? DECIMEN_CODES : cols * cols;
    // fixed  → tell the server how many device pixels one code may use
    // manual → ask for exactly that many pixels per module
    // scale  → let the server use its default module size; the page stretches
    if (fitModeInput.value === 'fixed') {
      url += '&fit=' + fitBudget(codesCount);
    } else if (fitModeInput.value === 'manual') {
      url += '&ppm=' + clampPPM(ppmInput.value);
    }
    const resp = await fetch(url, { method: 'POST', body: await file.arrayBuffer(), signal: controller.signal });
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    if (generation !== encodeGeneration) {
      fetch('/cancel/' + data.id,{method:'DELETE'}).catch(() => {});
      return null;
    }
    statusEl.textContent = '编码完成：' + bytesFmt(file.size) + ' · MD5: ' + (data.md5 || '');
    return {
      id: data.id, count: data.count, total: data.total,
      fps: fps, split: data.split || split, cols: cols,
      codes: decimen ? DECIMEN_CODES : cols * cols,
      dims: gridDims(decimen ? DECIMEN_CODES : cols * cols),
      carousel: !!data.carousel, k: data.k, sessionId: data.sessionId, blockLen: data.blockLen || data.split || split,
      modules: data.modules || 0, ppm: data.ppm || 0,
    };
  } catch (e) {
    if (generation !== encodeGeneration) return null;
    if (e && e.name === 'AbortError') {
      statusEl.textContent = '已取消序列化';
      return null;
    }
    statusEl.textContent = '编码失败: ' + e.message;
    return null;
  } finally {
    if (generation === encodeGeneration) {
      encoding = false;
      encodeAbort = null;
      startBtn.disabled = false;
      startBtn.textContent = '序列化';
    }
  }
}

async function start() {
  const generation = ++encodeGeneration;
  clearPlayback();
  running = false;
  // re-encode always, so params/file changes take effect and stale session is dropped
  if (session) await cancelSession();
  if (generation !== encodeGeneration) return;
  const nextSession = await encodeFile(generation);
  if (generation !== encodeGeneration) return;
  session = nextSession;
  if (!session) return;
  presentedFrames = 0;
  seqCursor = 0;
  startTime = performance.now();
  paused = false;
  pauseBtn.textContent = '暂停';
  buildTiles(session.codes, session.dims);
  running = true;
  overlay.classList.add('active');
  // Only measure once the overlay is visible: while it is display:none the grid
  // has no box. The image size itself does not depend on this measurement.
  applyFrameSize();
  requestAnimationFrame(applyFrameSize);
  if (session.carousel) startDecimenLoop();
  else showFrame();
}

// Keep enough decoded images ahead to overlap network and Image.decode().
// A single next image can miss a compositor turn and halve the displayed FPS.
function showFrame() { startPlayback(); }
function startDecimenLoop() { startPlayback(); }

function startPlayback() {
  clearPlayback();
  if (!running || paused || !session) return;
  const generation = playbackGeneration;
  playbackEpoch = null;
  const phase = session.carousel ? 1000 / session.fps / session.codes : 0;
  playbackCells = tiles.map((_, index) => ({index, phase: index * phase,
    nextAt: null, slots: []}));
  fillPrefetch(generation);
  playbackRAF = requestAnimationFrame(time => playbackTick(time, generation));
}

function fillPrefetch(generation) {
  if (generation !== playbackGeneration) return;
  // Allocate sequences by depth then cell, preserving the usual systematic
  // sweep across a grid while requests are allowed to complete independently.
  for (let depth = 0; depth < PREFETCH_DEPTH; depth++) for (const cell of playbackCells) {
    if (cell.slots.length > depth) continue;
    const slot = {frameIndex: seqCursor++ % session.count, image: null, url: null,
      controller: null, loading: false, ready: false, retryAt: 0, failures: 0};
    cell.slots.push(slot);
    prefetchFrame(slot, generation);
  }
}

async function prefetchFrame(slot, generation) {
  if (slot.loading || slot.ready || generation !== playbackGeneration) return;
  slot.loading = true;
  slot.controller = new AbortController();
  try {
    const response = await fetch('/frame/' + session.id + '/' + slot.frameIndex,
      {signal: slot.controller.signal, cache: 'no-store'});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const blob = await response.blob();
    if (generation !== playbackGeneration) return;
    slot.image = new Image();
    slot.url = URL.createObjectURL(blob);
    slot.image.src = slot.url;
    await slot.image.decode();
    if (generation !== playbackGeneration) return;
    slot.ready = true;
    slot.failures = 0;
  } catch (error) {
    if (generation === playbackGeneration && error.name !== 'AbortError') {
      slot.failures++;
      slot.retryAt = performance.now() + Math.min(3000, 250 * 2 ** Math.min(4, slot.failures - 1));
      statsEl.textContent = '取帧失败，正在重试：' + error.message;
    }
  } finally {
    if (!slot.ready || generation !== playbackGeneration) releaseFrame(slot);
    slot.loading = false;
  }
}

function playbackTick(now, generation) {
  if (generation !== playbackGeneration || !running || paused || !session) return;
  playbackRAF = null;
  if (playbackEpoch === null && playbackCells.some(cell => cell.slots[0]?.ready)) {
    playbackEpoch = now;
    for (const cell of playbackCells) cell.nextAt = now + cell.phase;
  }
  const interval = 1000 / session.fps;
  let changed = 0;
  for (const cell of playbackCells) {
    for (const slot of cell.slots) if (!slot.loading && !slot.ready && now >= slot.retryAt) prefetchFrame(slot, generation);
    const ready = cell.slots[0];
    if (!ready?.ready || cell.nextAt === null || now + PRESENTATION_TOLERANCE_MS < cell.nextAt) continue;
    const previous = tiles[cell.index];
    ready.image.alt = 'QR';
    ready.image.style.cssText = previous.style.cssText;
    ready.image.qrtURL = ready.url;
    ready.url = null;
    previous.replaceWith(ready.image);
    if (previous.qrtURL) URL.revokeObjectURL(previous.qrtURL);
    tiles[cell.index] = ready.image;
    cell.slots.shift();
    // Advance the established timeline, rather than restarting the interval
    // at a jittered RAF timestamp. This avoids 30->20 and 60->30 FPS rounding.
    const intervals = Math.max(1, Math.floor((now + PRESENTATION_TOLERANCE_MS - cell.nextAt) / interval) + 1);
    cell.nextAt += intervals * interval;
    presentedFrames++;
    changed++;
    // All cells due in this refresh can update. Serializing an N-cell grid
    // into one flip per refresh imposes an unintended N-fold throughput cap.
  }
  fillPrefetch(generation);
  if (changed) {
    const elapsed = Math.max(0.001, (performance.now() - startTime) / 1000);
    statsEl.textContent = '已显示 ' + presentedFrames + ' 帧'
      + ' | 网格 ' + session.dims.cols + 'x' + session.dims.rows
      + ' | ' + sizeNote()
      + ' | 平均显示 ' + (presentedFrames / elapsed).toFixed(1) + ' 帧/s'
      + (session.carousel ? ' | K=' + session.k : '');
  }
  playbackRAF = requestAnimationFrame(time => playbackTick(time, generation));
}

// sizeNote turns the current sizing state into one short phrase for the HUD, so
// a mismatch (wrong mode for the frames being served) is visible rather than
// silently resampled.
function sizeNote() {
  if (!session) return '';
  if (session.applied === 'scale') return '铺满窗口（允许缩放）';
  if (session.applied === 'pending') return '点「序列化」应用 ' + clampPPM(ppmInput.value) + 'px/模块';
  if (!session.ppm) return '';
  return session.ppm + 'px/模块' + (session.fitOk === false ? '，窗口偏小已缩放' : '');
}

function togglePause() {
  if (!running) return;
  clearPlayback();
  paused = !paused;
  pauseBtn.textContent = paused ? '继续' : '暂停';
  if (!paused) {
    if (session && session.carousel) startDecimenLoop();
    else showFrame();
  }
}

function stop() {
  if (!running && !session) return;
  clearPlayback();
  running = false;
  paused = false;
  pauseBtn.textContent = '暂停';
  overlay.classList.remove('active');
  releaseTiles();
  gridEl.innerHTML = '';
  tiles = [];
  startBtn.textContent = '继续序列化';
  showFileInfo();
}

async function cancelSession() {
  const id = session && session.id;
  session = null;
  if (id) {
    try { await fetch('/cancel/' + id, { method: 'DELETE' }); } catch (e) { /* ignore */ }
  }
}

async function cancel() {
  const generation = ++encodeGeneration;
  encoding = false;
  if (encodeAbort) encodeAbort.abort(); // abort any in-flight serialization
  clearPlayback();
  running = false;
  paused = false;
  pauseBtn.textContent = '暂停';
  overlay.classList.remove('active');
  releaseTiles();
  gridEl.innerHTML = '';
  tiles = [];
  await cancelSession();
  if (generation !== encodeGeneration) return;
  startBtn.textContent = '序列化';
  showFileInfo();
}

fileInput.addEventListener('change', function () {
  // re-selected file: drop the old session so everything is fresh
  cancel();
  updateFileMD5();
});

startBtn.addEventListener('click', function () {
  if (encoding && encodeAbort) { encodeAbort.abort(); }
  else { start(); }
});
pauseBtn.addEventListener('click', togglePause);
stopBtn.addEventListener('click', stop);
cancelBtn.addEventListener('click', cancel);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') stop();
  else if (e.key === ' ') { e.preventDefault(); togglePause(); }
  else if (e.key === 's' || e.key === 'S') stop();
  else if (e.key === 'c' || e.key === 'C') cancel();
});
</script>

</body>
