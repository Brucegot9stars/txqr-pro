name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # Everything that can be built and run on Windows: the whole module.
  # -race needs cgo, so the Windows job runs the full suite without it.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: txqr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: txqr/go.mod
          cache-dependency-path: txqr/go.sum

      - name: gofmt
        run: |
          $bad = gofmt -l ./cmd ./internal
          if ($bad) { Write-Error "gofmt needed:`n$bad"; exit 1 }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 300s

      # The off-screen -snapshot route reads the bitmap handle directly, so it
      # cannot catch a bug in the blit that puts pixels onto a real window DC
      # (a release once shipped a blank window exactly that way). QRT_PAINT_CHECK
      # samples the window DC after the blit; a white sample means the blank
      # window came back.
      - name: Real-window paint check
        shell: bash
        run: |
          go build -o qrt-pro-paintcheck.exe ./cmd/qrt-pro
          rm -f paintcheck.log
          QRT_PAINT_CHECK="$PWD/paintcheck.log" ./qrt-pro-paintcheck.exe &
          APP=$!
          sleep 6
          taskkill //PID $APP //F || true
          sleep 1
          if [ ! -s paintcheck.log ]; then
            echo "WM_PAINT never fired (no interactive desktop) - skipping"
            exit 0
          fi
          cat paintcheck.log
          if grep -q "rgb(255,255,255)" paintcheck.log; then
            echo "blank window: blit put nothing on the window DC"
            exit 1
          fi

  # Native w32/uikit remain Windows-only. Scanner's native capture boundary is
  # split by platform, so its shared pipeline can run under Linux -race too.
  race:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: txqr
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: txqr/go.mod
          cache-dependency-path: txqr/go.sum

      - name: Test with race detector
        run: go test -race -short . ./internal/scanner/... ./internal/sender/... ./decimen/... ./qr/... -timeout 300s

      - name: Set up Node for playback regressions
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test playback and actual presentation cadence
        run: |
          node internal/sender/testdata/playback.test.cjs
          node internal/sender/testdata/throughput.test.cjs

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: txqr-reader/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test release receiver
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :app:testReleaseUnitTest --no-daemon --console=plain > "$RUNNER_TEMP/qrt-android-test.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/qrt-android-test.log"
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY_DIAGNOSTIC'
          import os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'qrt-android-test.log').read_text(errors='replace').splitlines()
          selected = set()
          for index, line in enumerate(lines):
              if any(marker in line for marker in ('e: ', 'error:', '* What went wrong:', 'FAILURE:', 'Execution failed', 'Could not', 'Exception')):
                  selected.update(range(max(0, index - 1), min(len(lines), index + 12)))
          if not selected:
              selected.update(range(max(0, len(lines) - 80), len(lines)))
          message = '\n'.join(lines[index] for index in sorted(selected))[-16000:]
          escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android release unit test diagnostics::' + escaped)
          PY_DIAGNOSTIC
          fi
          exit "$result"
