name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: txqr/go.mod
          cache-dependency-path: txqr/go.sum

      # One binary now hosts both the sender and the receiver: the old
      # txqr-web / txqr-desktop / txqr-launcher trio is replaced by cmd/qrt-pro.
      - name: Build Windows unified app
        working-directory: txqr/cmd/qrt-pro
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w -H windowsgui" -o "../../../dist/qrt-pro-windows-amd64-${{ github.ref_name }}.exe" .
          ls -lh ../../../dist/

      - name: Build Windows portable sender (headless, no UI)
        working-directory: txqr/cmd/txqr-web
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w -H windowsgui" -o "../../../dist/qrt-pro-sender-windows-amd64-${{ github.ref_name }}.exe" .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "${ANDROID_HOME}/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "${ANDROID_HOME}/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"

      - name: Build release APK
        working-directory: txqr-reader/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease --no-daemon

      - name: Stage release APK with version name
        working-directory: txqr-reader/android
        run: |
          # txqr-reader/android -> ../.. is the repo root; one more ".." would
          # drop the APK outside the workspace, where the upload step silently
          # reported "pattern does not match any files" and shipped a release
          # without the APK.
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk "../../dist/qrt-pro-reader-${{ github.ref_name }}.apk"
          ls -lh ../../dist/
          # Fail loudly rather than publish a release that is missing an asset.
          test -s "../../dist/qrt-pro-reader-${{ github.ref_name }}.apk"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          # A silently missing asset is worse than a red build: catch it here.
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/qrt-pro-windows-amd64-${{ github.ref_name }}.exe
            dist/qrt-pro-sender-windows-amd64-${{ github.ref_name }}.exe
            dist/qrt-pro-reader-${{ github.ref_name }}.apk
