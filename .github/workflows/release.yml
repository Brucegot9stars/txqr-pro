name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: txqr/go.sum

      - name: Build Windows portable sender
        working-directory: txqr/cmd/txqr-web
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w" -o ../../../dist/qrt-pro-sender-windows-amd64.exe .
          ls -lh ../../../dist/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "${ANDROID_HOME}/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "${ANDROID_HOME}/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"

      - name: Build debug APK
        working-directory: txqr-reader/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qrt-pro-sender-windows-amd64.exe
            txqr-reader/android/app/build/outputs/apk/debug/app-debug.apk